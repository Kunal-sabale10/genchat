<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>

  <!-- Glowing Quantum Shield Orbit -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#shieldGrad)" stroke-width="4" opacity="0.3" stroke-dasharray="12 12"/>

  <!-- Main Quantum Shield -->
  <path d="M256 96 C328 128 392 128 408 136 C408 272 344 368 256 416 C168 368 104 272 104 136 C120 128 184 128 256 96 Z"
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Dark Shield Cutout -->
  <path d="M256 120 C316 148 368 148 382 154 C382 262 330 342 256 384 C182 342 130 262 130 154 C144 148 196 148 256 120 Z"
        fill="#0b1120"/>

  <!-- Chat Bubble Silhouette inside Shield -->
  <path d="M200 200 H312 C330 200 344 214 344 232 V280 C344 298 330 312 312 312 H264 L224 344 V312 H200 C182 312 168 298 168 280 V232 C168 214 182 200 200 200 Z"
        fill="url(#chatGrad)"/>

  <!-- Post-Quantum Keyhole / Lattice Symbol -->
  <circle cx="236" cy="256" r="8" fill="#6366f1"/>
  <circle cx="276" cy="256" r="8" fill="#38bdf8"/>
  <circle cx="256" cy="256" r="8" fill="#a855f7"/>
  <path d="M236 256 H276" stroke="#38bdf8" stroke-width="3"/>
</svg>
