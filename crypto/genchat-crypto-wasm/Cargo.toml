[package]
name = "genchat-crypto-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for GenChat PQXDH and Double Ratchet cryptographic core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
genchat-crypto = { path = "../genchat-crypto" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
wasm-bindgen-test = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
