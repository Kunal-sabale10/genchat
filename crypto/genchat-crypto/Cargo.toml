[package]
name = "genchat-crypto"
version = "0.1.0"
edition = "2021"
description = "GenChat E2EE crypto core: PQXDH + Double Ratchet"

[dependencies]
vodozemac = "0.8"
ml-kem = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
hex = "0.4"
