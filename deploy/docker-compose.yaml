services:
  postgres:
    image: postgres:17-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: genchat
      POSTGRES_USER: genchat
      POSTGRES_PASSWORD: dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../schema/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  scylladb:
    image: scylladb/scylla:6.2
    ports: ["9042:9042", "19042:19042"]
    command: --smp 2 --memory 1G --overprovisioned 1 --developer-mode 1
    volumes:
      - scylladata:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 10s
      retries: 10

  scylla-init:
    image: scylladb/scylla:6.2
    volumes:
      - ../schema/scylla/001_messages.cql:/schema/001_messages.cql:ro
    entrypoint: ["cqlsh", "scylladb", "9042", "-f", "/schema/001_messages.cql"]
    depends_on:
      scylladb:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # NOT included in the default `docker-compose up` — its cluster config
  # (deploy/envoy/envoy.yaml) still points at a placeholder upstream host
  # that doesn't resolve in this compose network, and it isn't on the path
  # the browser actually uses (client-web talks directly to
  # auth:8080/gateway:8081/media:8082 via Vite's dev proxy). Bring it up
  # explicitly with `docker compose --profile with-envoy up` once that
  # config is reconciled with real service names.
  envoy:
    profiles: ["with-envoy"]
    image: envoyproxy/envoy:v1.32-latest
    ports:
      - "8443:443"
      - "8088:80"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs:/etc/envoy/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      scylladb:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth:
    build:
      context: ..
      dockerfile: Dockerfile
      target: auth
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      - POSTGRES_URL=postgres://genchat:dev_password@postgres:5432/genchat?sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      # Must match the origin the browser actually loads the app from.
      # packages/client-web's Vite dev server runs on :3000 by default
      # (see packages/client-web/vite.config.ts) — if you change that port,
      # update this to match or every WebAuthn ceremony will fail with an
      # origin mismatch.
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_RP_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      target: gateway
    ports:
      - "8081:8081"
    environment:
      - JWT_SECRET=dev-secret-change-in-production
      - LEDGER_ADDR=ledger:50052
      # Local dev only — do not set this in any deployed environment. It
      # disables the WebSocket Origin/CSRF check.
      - WS_ALLOW_ANY_ORIGIN=true
    depends_on:
      redis:
        condition: service_healthy
      ledger:
        condition: service_started

  ledger:
    build:
      context: ..
      dockerfile: Dockerfile
      target: ledger
    ports:
      - "50052:50052"
    environment:
      - SCYLLA_HOSTS=scylladb
      - REDIS_ADDR=redis:6379
    depends_on:
      scylla-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secret
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Nothing else creates the media bucket — the media service only ever
  # generates presigned URLs against it, it never calls MakeBucket. Without
  # this, every upload/download fails with NoSuchBucket even with a
  # correctly-signed URL.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin_secret &&
      mc mb --ignore-existing local/genchat-media
      "
    restart: "no"

  media:
    build:
      context: ..
      dockerfile: Dockerfile
      target: media
    ports:
      - "8082:8082"
    environment:
      # mediad never calls MinIO directly -- signURL only computes a
      # signature, it doesn't make network calls. This value becomes the
      # Host in the presigned URL handed to the BROWSER, so it must be an
      # address the browser can reach -- 'minio:9000' (the Docker-network
      # hostname) is NOT reachable from the host machine's browser, only
      # from other containers. Use the host-published port instead.
      - MINIO_ENDPOINT=localhost:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin_secret
      - PORT=8082
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  scylladata:
  miniodata:
