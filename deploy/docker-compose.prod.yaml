# GenChat Production Docker Compose Stack
# Hardened for direct VPS / Cloud VM deployment with automated Caddy TLS
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      - GENCHAT_DOMAIN=${GENCHAT_DOMAIN:?Error: GENCHAT_DOMAIN must be set in .env}
      - ACME_EMAIL=${ACME_EMAIL:?Error: ACME_EMAIL must be set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../packages/client-web/dist:/usr/share/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth
      - gateway
      - media

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genchat}
      POSTGRES_USER: ${POSTGRES_USER:-genchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../schema/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genchat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  scylladb:
    image: scylladb/scylla:6.2
    restart: unless-stopped
    command: --smp 2 --memory 2G --overprovisioned 1
    volumes:
      - scylladata:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 10s
      retries: 10

  scylla-init:
    image: scylladb/scylla:6.2
    volumes:
      - ../schema/scylla/001_messages.cql:/schema/001_messages.cql:ro
    entrypoint: ["cqlsh", "scylladb", "9042", "-f", "/schema/001_messages.cql"]
    depends_on:
      scylladb:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    build:
      context: ..
      dockerfile: Dockerfile
      target: auth
    restart: unless-stopped
    environment:
      - POSTGRES_URL=postgres://${POSTGRES_USER:-genchat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-genchat}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?Error: JWT_SECRET must be set in .env}
      - WEBAUTHN_RP_ID=${GENCHAT_DOMAIN}
      - WEBAUTHN_RP_ORIGIN=https://${GENCHAT_DOMAIN}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET}
      - TURN_REALM=${GENCHAT_DOMAIN}
      - TURN_URLS=turn:${GENCHAT_DOMAIN}:3478?transport=udp,turn:${GENCHAT_DOMAIN}:3478?transport=tcp
      - ALLOWED_ORIGINS=https://${GENCHAT_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      target: gateway
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET:?Error: JWT_SECRET must be set in .env}
      - REDIS_ADDR=redis:6379
      - LEDGER_ADDR=ledger:50052
      - AUTH_ADDR=auth:50051
      # Strict Origin & Security Enforcement in Production
      - WS_ALLOW_ANY_ORIGIN=false
      - ALLOWED_WS_ORIGINS=https://${GENCHAT_DOMAIN}
      - ALLOWED_ORIGINS=https://${GENCHAT_DOMAIN}
      - PREAUTH_RATE_PER_MINUTE=${PREAUTH_RATE_PER_MINUTE:-10000}
      - PREAUTH_BURST=${PREAUTH_BURST:-1000}
      - WS_RATE_PER_MINUTE=${WS_RATE_PER_MINUTE:-12000}
      - WS_RATE_BURST=${WS_RATE_BURST:-1000}
      - WS_FRESH_RATE_PER_MINUTE=${WS_FRESH_RATE_PER_MINUTE:-12000}
      - WS_FRESH_BURST=${WS_FRESH_BURST:-1000}
      - DEVICE_CAP_POLICY=evict_oldest
      - MAX_HEAP_MB=1536
      - GOMEMLIMIT=1800MiB
    depends_on:
      redis:
        condition: service_healthy
      ledger:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  ledger:
    build:
      context: ..
      dockerfile: Dockerfile
      target: ledger
    restart: unless-stopped
    environment:
      - SCYLLA_HOSTS=scylladb
      - REDIS_ADDR=redis:6379
    depends_on:
      scylla-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50052 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Error: MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Error: MINIO_ROOT_PASSWORD must be set in .env}
    command: server /data
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/genchat-media
      "
    restart: "no"

  media:
    build:
      context: ..
      dockerfile: Dockerfile
      target: media
    restart: unless-stopped
    environment:
      - MINIO_ENDPOINT=${GENCHAT_DOMAIN}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - PORT=8082
      - ALLOWED_ORIGINS=https://${GENCHAT_DOMAIN}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49160:49152-49160/udp"
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --realm=${GENCHAT_DOMAIN}
      - --use-auth-secret
      - --static-auth-secret
      - ${TURN_SHARED_SECRET}
      - --min-port=49152
      - --max-port=49160
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  scylladata:
  miniodata:
  redisdata:
