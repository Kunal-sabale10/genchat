apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: genchat-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: genchat-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genchat-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.gateway.port }}"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: gateway
          image: "{{ .Values.global.imageRegistry }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["gatewayd"]
          ports:
            - name: ws
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.gateway.port }}"
            - name: REDIS_ADDR
              value: "{{ .Values.databases.redis.host }}:{{ .Values.databases.redis.port }}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.monitoring.otlpEndpoint }}"
            - name: LEDGER_ADDR
              value: "{{ .Release.Name }}-ledger:{{ .Values.ledger.port }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-shared-secrets
                  key: jwt-secret
            - name: MAX_CONNECTIONS_PER_POD
              value: "{{ .Values.gateway.maxConnectionsPerPod | default 10000 }}"
            - name: MAX_DEVICES_PER_USER
              value: "{{ .Values.gateway.maxDevicesPerUser | default 5 }}"
            - name: DEVICE_CAP_POLICY
              value: "{{ .Values.gateway.deviceCapPolicy | default "evict_oldest" }}"
            - name: MAX_HEAP_MB
              value: "{{ .Values.gateway.maxHeapMB | default 1536 }}"
            - name: MAX_GOROUTINES
              value: "{{ .Values.gateway.maxGoroutines | default 25000 }}"
            - name: GOMEMLIMIT
              value: "{{ .Values.gateway.gomemlimit | default "1800MiB" }}"
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: genchat-gateway
spec:
  type: ClusterIP
  ports:
    - name: ws
      port: {{ .Values.gateway.port }}
      targetPort: ws
  selector:
    app.kubernetes.io/name: genchat-gateway
