apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: genchat-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: genchat-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genchat-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.gateway.port }}"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: gateway
          image: "{{ .Values.global.imageRegistry }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["gatewayd"]
          ports:
            - name: ws
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.gateway.port }}"
            - name: REDIS_ADDR
              value: "{{ .Values.databases.redis.host }}:{{ .Values.databases.redis.port }}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.monitoring.otlpEndpoint }}"
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: genchat-gateway
spec:
  type: ClusterIP
  ports:
    - name: ws
      port: {{ .Values.gateway.port }}
      targetPort: ws
  selector:
    app.kubernetes.io/name: genchat-gateway
