# -------------------------------------------------------------
# Auth Microservice
# -------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-auth
  labels:
    app.kubernetes.io/name: genchat-auth
spec:
  replicas: {{ .Values.auth.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: genchat-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genchat-auth
    spec:
      containers:
        - name: auth
          image: "{{ .Values.global.imageRegistry }}:{{ .Values.global.imageTag }}"
          command: ["authd"]
          ports:
            - name: grpc
              containerPort: {{ .Values.auth.port }}
          env:
            - name: POSTGRES_URL
              value: "postgres://{{ .Values.databases.postgres.user }}@{{ .Values.databases.postgres.host }}:{{ .Values.databases.postgres.port }}/{{ .Values.databases.postgres.database }}?sslmode=require"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-shared-secrets
                  key: jwt-secret
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-auth
  labels:
    app.kubernetes.io/name: genchat-auth
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: {{ .Values.auth.port }}
      targetPort: grpc
  selector:
    app.kubernetes.io/name: genchat-auth
---
# -------------------------------------------------------------
# Message Ledger Microservice
# -------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ledger
  labels:
    app.kubernetes.io/name: genchat-ledger
spec:
  replicas: {{ .Values.ledger.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: genchat-ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genchat-ledger
    spec:
      containers:
        - name: ledger
          image: "{{ .Values.global.imageRegistry }}:{{ .Values.global.imageTag }}"
          command: ["ledgerd"]
          ports:
            - name: grpc
              containerPort: {{ .Values.ledger.port }}
          env:
            - name: SCYLLA_HOSTS
              value: "{{ .Values.databases.scylladb.hosts }}"
            - name: REDIS_ADDR
              value: "{{ .Values.databases.redis.host }}:{{ .Values.databases.redis.port }}"
          resources:
            {{- toYaml .Values.ledger.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ledger
  labels:
    app.kubernetes.io/name: genchat-ledger
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: {{ .Values.ledger.port }}
      targetPort: grpc
  selector:
    app.kubernetes.io/name: genchat-ledger
---
# -------------------------------------------------------------
# Media Microservice
# -------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-media
  labels:
    app.kubernetes.io/name: genchat-media
spec:
  replicas: {{ .Values.media.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: genchat-media
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genchat-media
    spec:
      containers:
        - name: media
          image: "{{ .Values.global.imageRegistry }}:{{ .Values.global.imageTag }}"
          command: ["mediad"]
          ports:
            - name: http
              containerPort: {{ .Values.media.port }}
          env:
            - name: MINIO_ENDPOINT
              value: "{{ .Values.databases.minio.endpoint }}"
            - name: PORT
              value: "{{ .Values.media.port }}"
          resources:
            {{- toYaml .Values.media.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-media
  labels:
    app.kubernetes.io/name: genchat-media
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.media.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: genchat-media
