# -------------------------------------------------------------
# Shared secrets
# -------------------------------------------------------------
# IMPORTANT: values.yaml's jwtSecret default below is the same dev-only
# value baked into every service's getEnv() fallback. It MUST be
# overridden per-environment (e.g. `helm install --set global.jwtSecret=...`
# or, better, via an external secret manager / sealed-secrets) — deploying
# with the default leaves every issued token forgeable by anyone who reads
# this chart's source.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-shared-secrets
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.global.jwtSecret | quote }}
