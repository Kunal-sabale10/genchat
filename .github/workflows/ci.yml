name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-crypto:
    name: Rust Crypto Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crypto/genchat-crypto
            crypto/genchat-crypto-ffi

      - name: Check genchat-crypto
        working-directory: crypto/genchat-crypto
        run: cargo check --verbose

      - name: Test genchat-crypto (including adversarial tests)
        working-directory: crypto/genchat-crypto
        run: cargo test --verbose

      - name: Check genchat-crypto-ffi
        working-directory: crypto/genchat-crypto-ffi
        run: cargo check --verbose

      - name: Test genchat-crypto-ffi
        working-directory: crypto/genchat-crypto-ffi
        run: cargo test --verbose

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run Rust Security Audit (cargo audit)
        continue-on-error: true
        run: |
          (cd crypto/genchat-crypto && cargo audit)
          (cd crypto/genchat-crypto-ffi && cargo audit)

  go-services:
    name: Go Backend Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Go Vet across Services
        run: |
          go vet ./services/auth/...
          go vet ./services/gateway/...
          go vet ./services/media/...
          go vet ./services/msgledger/...

      - name: Run Go Vulnerability Scanner (govulncheck)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          for dir in services/auth services/gateway services/media services/msgledger; do
            echo "=== Scanning $dir ==="
            (cd "$dir" && govulncheck ./...) || true
          done

      - name: Build All Go Service Daemons
        run: |
          mkdir -p bin
          go build -v -o bin/authd ./services/auth/cmd/authd
          go build -v -o bin/gatewayd ./services/gateway/cmd/gatewayd
          go build -v -o bin/ledgerd ./services/msgledger/cmd/ledgerd
          go build -v -o bin/mediad ./services/media/cmd/mediad

      - name: Run Go Unit Tests across Services
        run: |
          go test -v ./services/auth/...
          go test -v ./services/gateway/...
          go test -v ./services/media/...
          go test -v ./services/msgledger/...

  client-web:
    name: Web Client (TypeScript & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: packages/client-web/package-lock.json

      - name: Install dependencies
        working-directory: packages/client-web
        run: npm ci

      - name: Security Audit (npm audit)
        working-directory: packages/client-web
        run: npm audit --audit-level=high

      - name: Typecheck TypeScript
        working-directory: packages/client-web
        run: npm run typecheck

      - name: Build Web Application
        working-directory: packages/client-web
        run: npm run build

  integration-tests:
    name: End-to-End Integration Tests
    runs-on: ubuntu-latest
    needs: [go-services, client-web]
    env:
      NODE_OPTIONS: "--experimental-websocket"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Docker Compose Infrastructure
        run: |
          docker compose -f deploy/docker-compose.yaml up -d --build
          echo "Waiting for core backend services to become healthy..."
          timeout 120s bash -c 'until curl -sf http://127.0.0.1:8080/healthz > /dev/null 2>&1; do sleep 2; done'
          echo "✓ Auth service ready on port 8080"
          timeout 120s bash -c 'until curl -sf http://127.0.0.1:8081/healthz > /dev/null 2>&1; do sleep 2; done'
          echo "✓ Gateway service ready on port 8081"
          timeout 120s bash -c 'until curl -sf http://127.0.0.1:8082/healthz > /dev/null 2>&1; do sleep 2; done'
          echo "✓ Media service ready on port 8082"
          echo "All backend services confirmed healthy!"
          docker compose -f deploy/docker-compose.yaml ps

      - name: Run System Security Verification
        run: node tests/integration/test_security_hardening.mjs

      - name: Run Push Notifications Verification
        run: node tests/integration/test_push_notifications.mjs

      - name: Run Media Pipeline, MinIO S3 & SigV4 Tamper Verification
        run: node tests/integration/test_media_pipeline.mjs

      - name: Run WebRTC Call Signaling Verification
        run: node tests/integration/test_call_signaling.mjs

      - name: Run Bi-directional Chat, Dedup & ScyllaDB Persistence Verification
        run: node tests/integration/test_bidirectional_chat.mjs

      - name: Run Disappearing / Ephemeral Messages & Native ScyllaDB TTL Verification
        run: node tests/integration/test_ephemeral_messages.mjs

      - name: Run Cryptographic Safety Numbers & Trust Verification
        run: node tests/integration/test_safety_numbers.mjs

      - name: Run Encrypted Voice Notes & Waveform Player Verification
        run: node tests/integration/test_voice_notes.mjs

      - name: Run Cryptographic Message Reactions & Quoted Replies Verification
        run: node tests/integration/test_reactions_and_replies.mjs

      - name: Run Multi-Party WebRTC Group Calling & Mesh Signaling Verification
        run: node tests/integration/test_group_calling.mjs

      - name: Run Message Revocation & Deletion Verification
        run: node tests/integration/test_message_deletion.mjs

      - name: Run Phase 2 Full Features & Anti-Spoofing Interceptor Verification
        run: node tests/integration/test_phase2_full_features.mjs

      - name: Run MLS Multi-Party Group Chat & Epoch Commit Verification
        run: node tests/integration/test_mls_group_chat.mjs

      - name: Run Group Fan-Out High Concurrency Load Test
        run: node tests/integration/test_group_load_fanout.mjs

      - name: Collect Container Logs on Failure
        if: failure()
        run: |
          echo "=== DOCKER COMPOSE LOGS ==="
          docker compose -f deploy/docker-compose.yaml logs --tail=100

      - name: Tear Down Docker Compose Stack
        if: always()
        run: docker compose -f deploy/docker-compose.yaml down -v
